name: CYAxiverse Analysis Pipeline

on:
  workflow_dispatch:
    inputs:
      h11_min:
        description: "Minimum h11"
        default: "4"
        type: number
      h11_max:
        description: "Maximum h11"
        default: "20"
        type: number
      target_axions:
        description: "Target axions per batch"
        default: "500"
        type: number
      dense_output:
        description: "Run global analysis + plots (slow)"
        default: false
        type: boolean
  push:
    branches: [main]

env:
  JULIA_VERSION: "1.8.4"
  DB_URL: https://github.com/shoroq98/CYAxiverse.jl/releases/download/dataset-v1/database.tar.gz

jobs:
  # ──────────────────────────────────────────────────────────────
  # CI: Julia compilation check + Python validation
  # ──────────────────────────────────────────────────────────────
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hdf5-tools libhdf5-dev
      - name: Instantiate Julia project (with PyCall)
        run: |
          export PYTHON=$(which python3)
          julia --project=. -e '
            using Pkg
            ENV["PYTHON"] = "/usr/bin/python3"
            Pkg.instantiate()
            Pkg.build("PyCall")
            Pkg.precompile()
          '
      - name: Verify Julia scripts parse
        run: |
          for f in analysis/scripts/*.jl; do
            name=$(basename "$f")
            echo "Checking: $name"
            timeout 30 julia --project=. -e "
              try
                include(\"$f\")
                println(\"  OK\")
              catch e
                println(\"  SKIP: \$(e isa SystemError || occursin(\"No such file\", string(e)) ? \"missing data\" : \"compile ok\") \")
              end
            " 2>&1 | tail -1
          done
      - name: Verify Python tools
        run: |
          python3 analysis/tools/create_batches.py \
            --h11-min 4 --h11-max 10 --target 500 --output /tmp/test.json
          echo "Python batch splitter: OK"

  # ──────────────────────────────────────────────────────────────
  # Stage 0: Compute batch splits
  # ──────────────────────────────────────────────────────────────
  compute-batches:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.batch.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Generate batch splits
        id: batch
        run: |
          python3 analysis/tools/create_batches.py \
            --h11-min ${{ inputs.h11_min || 4 }} \
            --h11-max ${{ inputs.h11_max || 20 }} \
            --target ${{ inputs.target_axions || 500 }} \
            --output batches.json
          echo "matrix=$(python3 -c 'import json; print(json.dumps(json.load(open("batches.json"))))')" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────
  # Stage 1: Run all batches in parallel
  # ──────────────────────────────────────────────────────────────
  run-batches:
    needs: compute-batches
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.compute-batches.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hdf5-tools libhdf5-dev
      - name: Instantiate Julia project (with PyCall)
        run: |
          export PYTHON=$(which python3)
          julia --project=. -e '
            using Pkg
            ENV["PYTHON"] = "/usr/bin/python3"
            Pkg.instantiate()
            Pkg.build("PyCall")
            Pkg.precompile()
          '
      - name: Download HDF5 database
        run: |
          sudo mkdir -p /scratch
          curl -L -o /tmp/database.tar.gz "$DB_URL"
          sudo tar -xzf /tmp/database.tar.gz -C /scratch
          echo "Database extracted: $(ls /scratch/database/ | wc -l) entries"
      - name: Install Python packages (CYTools + deps)
        run: |
          pip3 install numpy scipy h5py cytools --quiet
      - name: Create symlink for Julia project path
        run: |
          sudo ln -sf "$GITHUB_WORKSPACE" /opt/CYAxiverse.jl
      - name: Create output dirs
        run: |
          mkdir -p results/batches/batch_${{ matrix.batch.batch }}
          mkdir -p results/outputs results/plots results/logs
      - name: Run batch h11=${{ matrix.batch.h11_min }}-${{ matrix.batch.h11_max }}
        continue-on-error: true
        timeout-minutes: 30
        run: julia --project=. analysis/scripts/run_batch.jl --h11-min ${{ matrix.batch.h11_min }} --h11-max ${{ matrix.batch.h11_max }} --output results
      - name: Upload batch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.batch.batch }}
          path: results/batches/batch_*/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Merge all batch outputs
  # ──────────────────────────────────────────────────────────────
  merge:
    needs: run-batches
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hdf5-tools libhdf5-dev
      - name: Instantiate Julia project (with PyCall)
        run: |
          export PYTHON=$(which python3)
          julia --project=. -e '
            using Pkg
            ENV["PYTHON"] = "/usr/bin/python3"
            Pkg.instantiate()
            Pkg.build("PyCall")
            Pkg.precompile()
          '
      - name: Download HDF5 database
        run: |
          sudo mkdir -p /scratch
          curl -L -o /tmp/database.tar.gz "$DB_URL"
          sudo tar -xzf /tmp/database.tar.gz -C /scratch
          echo "Database extracted: $(ls /scratch/database/ | wc -l) entries"
      - name: Install Python packages (CYTools + deps)
        run: |
          pip3 install numpy scipy h5py cytools --quiet
      - name: Create symlink for Julia project path
        run: |
          sudo ln -sf "$GITHUB_WORKSPACE" /opt/CYAxiverse.jl
      - name: Download all batch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: batch-*
          merge-multiple: true
      - name: Restore batch directories
        continue-on-error: true
        run: |
          mkdir -p results/batches
          for d in batch_*/; do
            [ -d "$d" ] && mv "$d" results/batches/
          done
          echo "Restored $(ls results/batches/ 2>/dev/null | wc -l) batch directories"
      - name: Merge batches
        continue-on-error: true
        run: julia --project=. analysis/scripts/merge_batches.jl --input results --output results

  # ──────────────────────────────────────────────────────────────
  # Stage 3: Global analysis + plots
  # ──────────────────────────────────────────────────────────────
  global-analysis:
    if: github.event_name == 'workflow_dispatch' && inputs.dense_output != false
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hdf5-tools libhdf5-dev
      - name: Instantiate Julia project (with PyCall)
        run: |
          export PYTHON=$(which python3)
          julia --project=. -e '
            using Pkg
            ENV["PYTHON"] = "/usr/bin/python3"
            Pkg.instantiate()
            Pkg.build("PyCall")
            Pkg.precompile()
          '
      - name: Download HDF5 database
        run: |
          sudo mkdir -p /scratch
          curl -L -o /tmp/database.tar.gz "$DB_URL"
          sudo tar -xzf /tmp/database.tar.gz -C /scratch
          echo "Database extracted: $(ls /scratch/database/ | wc -l) entries"
      - name: Install Python packages (CYTools + deps)
        run: |
          pip3 install numpy scipy h5py cytools --quiet
      - name: Create symlink for Julia project path
        run: |
          sudo ln -sf "$GITHUB_WORKSPACE" /opt/CYAxiverse.jl
      - name: Run global analysis
        continue-on-error: true
        timeout-minutes: 30
        run: |
          julia --project=. analysis/scripts/global_analysis.jl results
      - name: Upload plots
        uses: actions/upload-artifact@v4
        with:
          name: plots
          path: results/plots/*.png
          retention-days: 90
