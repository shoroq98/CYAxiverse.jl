name: CYAxiverse Analysis Pipeline

on:
  workflow_dispatch:
    inputs:
      h11_min:
        description: "Minimum h11"
        default: "4"
        type: number
      h11_max:
        description: "Maximum h11"
        default: "20"
        type: number
      target_axions:
        description: "Target axions per batch"
        default: "2000"
        type: number
      dense_output:
        description: "Run global analysis + plots (slow)"
        default: false
        type: boolean

env:
  JULIA_VERSION: "1.8.4"
  JULIA_PROJECT: ${{ github.workspace }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Stage 0: Compute batch splits
  # ──────────────────────────────────────────────────────────────
  compute-batches:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.batch.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate batch splits
        id: batch
        run: |
          python analysis/tools/create_batches.py \
            --h11-min ${{ inputs.h11_min || 4 }} \
            --h11-max ${{ inputs.h11_max || 20 }} \
            --target ${{ inputs.target_axions || 2000 }} \
            --output batches.json
          echo "matrix=$(cat batches.json)" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────
  # Stage 1: Run all batches in parallel
  # ──────────────────────────────────────────────────────────────
  run-batches:
    needs: compute-batches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.compute-batches.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
          project: ${{ env.JULIA_PROJECT }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hdf5-tools libhdf5-dev
      - name: Install Julia deps
        run: |
          julia --project=${{ env.JULIA_PROJECT }} -e '
            using Pkg
            Pkg.develop(path=".")  # Register local CYAxiverse.jl
            Pkg.add(["HDF5", "Serialization", "Printf", "Dates", "LinearAlgebra", "Statistics"])
            Pkg.precompile()
          '
      - name: Create output directory
        run: |
          mkdir -p ${{ github.workspace }}/results/batches/batch_${{ matrix.batch.batch }}
      - name: Run batch h11=${{ matrix.batch.h11_min }}-${{ matrix.batch.h11_max }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          julia --project=${{ env.JULIA_PROJECT }} \
            analysis/scripts/run_batch.jl \
            --h11-min ${{ matrix.batch.h11_min }} \
            --h11-max ${{ matrix.batch.h11_max }} \
            --output ${{ github.workspace }}/results
      - name: Upload batch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.batch.batch }}
          path: ${{ github.workspace }}/results/batches/batch_*/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Merge all batch outputs
  # ──────────────────────────────────────────────────────────────
  merge:
    needs: run-batches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all batch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: batch-*
          merge-multiple: true
      - name: Restore batch directory structure
        run: |
          mkdir -p ${{ github.workspace }}/results/batches
          for d in batch_*/; do
            [ -d "$d" ] && mv "$d" "${{ github.workspace }}/results/batches/"
          done
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
          project: ${{ env.JULIA_PROJECT }}
      - name: Merge batches
        continue-on-error: true
        run: |
          julia --project=${{ env.JULIA_PROJECT }} \
            analysis/scripts/merge_batches.jl \
            --input ${{ github.workspace }}/results \
            --output ${{ github.workspace }}/results

  # ──────────────────────────────────────────────────────────────
  # Stage 3: Global analysis + plots (optional, slow)
  # ──────────────────────────────────────────────────────────────
  global-analysis:
    if: ${{ inputs.dense_output != false }}
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
          project: ${{ env.JULIA_PROJECT }}
      - name: Install CairoMakie
        run: |
          julia --project=${{ env.JULIA_PROJECT }} -e 'using Pkg; Pkg.add("CairoMakie")'
      - name: Run global analysis
        continue-on-error: true
        timeout-minutes: 30
        run: |
          julia --project=${{ env.JULIA_PROJECT }} \
            analysis/scripts/global_analysis.jl ${{ github.workspace }}/results
      - name: Upload plots
        uses: actions/upload-artifact@v4
        with:
          name: plots
          path: ${{ github.workspace }}/results/plots/*.png
          retention-days: 90

  # ──────────────────────────────────────────────────────────────
  # Stage 4: CI validation (runs on every push)
  # ──────────────────────────────────────────────────────────────
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
          project: ${{ env.JULIA_PROJECT }}
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq hdf5-tools libhdf5-dev
          julia --project=${{ env.JULIA_PROJECT }} -e '
            using Pkg
            Pkg.develop(path=".")
            Pkg.add(["HDF5", "Serialization", "Printf", "Dates", "LinearAlgebra", "Statistics"])
            Pkg.precompile()
          '
      - name: Verify Julia scripts compile
        run: |
          for f in analysis/scripts/*.jl; do
            echo "Checking: $f"
            julia --project=${{ env.JULIA_PROJECT }} -e "
              try
                include(\"$f\")
                println(\"  OK\")
              catch e
                if e isa ArgumentError || e isa SystemError
                  # Expected: missing data files in CI
                  println(\"  SKIP (no data): \$(e)\")
                else
                  rethrow()
                end
              end
            " 2>&1 | tail -1
          done
      - name: Verify Python tools
        run: |
          python3 analysis/tools/create_batches.py --h11-min 4 --h11-max 10 --target 500 --output /tmp/test_batches.json
          echo "Python batch splitter: OK"
          cat /tmp/test_batches.json
